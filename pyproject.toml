[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wanbot"
version = "0.1.0"
description = "Discord community bot"
requires-python = ">=3.10"
dependencies = [
    "discord.py>=2.6,<3",
    "python-dotenv>=1.1,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
    "ruff>=0.11,<1",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["wanbot*"]
namespaces = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
